<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esploro</title>
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('esploro-ui') || '{}');
          var theme = stored && stored.state && stored.state.theme;
          var resolved =
            theme === 'tairiki-light' || theme === 'macos-light' || theme === 'light'
              ? 'light'
              : theme === 'tairiki-dark' || theme === 'macos-dark' || theme === 'dark'
                ? 'dark'
                : null;
          if (resolved) {
            document.documentElement.setAttribute('data-theme', resolved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
