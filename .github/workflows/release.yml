name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-13
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust-target: ''
          - platform: windows-latest
            args: ''
            rust-target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend deps
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Esploro v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  update-homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Compute version and DMG SHA256
        id: meta
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          URL="https://github.com/matija/esploro/releases/download/${TAG}/Esploro_${VERSION}_aarch64.dmg"
          SHA=$(curl -fsSL "$URL" | sha256sum | awk '{print $1}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: matija/homebrew-esploro
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update Cask formula
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          SHA=${{ steps.meta.outputs.sha256 }}
          URL=${{ steps.meta.outputs.url }}
          CASK=tap/Casks/esploro.rb
          sed -i "s|version \".*\"|version \"$VERSION\"|" "$CASK"
          sed -i "s|sha256 \".*\"|sha256 \"$SHA\"|" "$CASK"
          sed -i "s|url \".*\"|url \"$URL\"|" "$CASK"

      - name: Commit and push
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/esploro.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "bump esploro to ${{ steps.meta.outputs.version }}"
          git push
