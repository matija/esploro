name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Type-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: TypeScript type-check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # ── Dependency safety (PRD Workstream 1: bump safety) ─────────────────
      # npm lockfile sync is already enforced by `npm ci` above: it aborts if
      # package.json and package-lock.json disagree. This asserts the same for
      # Cargo — `--locked` fails before any download if Cargo.lock would need
      # to change, so an out-of-band lockfile drift cannot land.
      - name: Cargo lockfile sync
        run: cargo metadata --locked --format-version 1 --manifest-path Cargo.toml > /dev/null

      # Bot policy: this repo deliberately uses no Dependabot/Renovate (see
      # docs/dependencies.md). Fail if a bot config is dropped in, so the
      # "no automated bumps" decision cannot be silently reversed.
      - name: No dependency-bot config
        run: |
          found=$(ls -1 \
            .github/dependabot.yml .github/dependabot.yaml \
            .github/renovate.json .github/renovate.json5 \
            renovate.json renovate.json5 \
            .renovaterc .renovaterc.json .renovaterc.json5 \
            2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "::error::Dependency-bot config found, but this repo's policy is no bots (docs/dependencies.md):"
            echo "$found"
            exit 1
          fi
          echo "No dependency-bot config present — policy holds."

      # Cooldown gate across both ecosystems (npm + cargo). Non-blocking until
      # one green run confirms it is stable on CI; then drop continue-on-error
      # to enforce. The npm half is already blocking via the `preinstall` hook
      # that runs during `npm ci`; this adds the cargo half and a unified report.
      - name: Dependency cooldown (npm + cargo)
        continue-on-error: true
        run: npm run deps:check

  build:
    name: Build (macOS)
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        run: npm run tauri -- build
