# Dependency cooldown allowlist — read by tools/check-dep-cooldown.mjs.
#
# The cooldown gate refuses any direct or transitive package whose published
# version is younger than 14 days. To intentionally accept a young version,
# add a dated [[allowlist]] entry below. Entries are time-boxed: once the
# package ages past the cooldown window, delete the entry — it no longer
# grants anything (isAllowed() ignores it after expires_at regardless).
#
# Format:
#   [[allowlist]]
#   package    = "name"
#   version    = "x.y.z"
#   reason     = "why this young version is accepted"
#   expires_at = "YYYY-MM-DD"   # the date it turns >=14 days old
#
# Currently empty: the five initial bootstrap entries (filetime, hashbrown,
# hybrid-array, serde_with, serde_with_macros) all aged past the cooldown
# window and were removed on 2026-06-03.
