[package]
name = "esploro"
version = "0.7.5"
description = "A modern, sleek and fast database client for PostgreSQL, MySQL, and MariaDB."
authors = ["Matija Munjaković"]
edition = "2021"
license = "MIT"

[lib]
name = "esploro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }

# Policy: direct deps are pinned to exact versions (=x.y.z) so a fresh resolve
# cannot move them within a caret range; transitive crates are governed by
# Cargo.lock. To bump: edit the version here and refresh Cargo.lock deliberately.
[dependencies]
tauri = { version = "=2.11.1", features = ["macos-private-api", "specta"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
uuid = { version = "=1.23.1", features = ["v4"] }
tokio = { version = "=1.52.3", features = ["full"] }
tokio-postgres = { version = "=0.7.17", features = ["with-serde_json-1"] }
deadpool-postgres = { version = "=0.12.1", features = ["rt_tokio_1"] }
mysql_async = { version = "=0.34.2", features = [] }
keyring = "=2.3.3"
thiserror = "=2.0.18"
chrono = { version = "=0.4.44", features = ["serde"] }
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
tauri-plugin-log = "=2.8.0"
