[package]
name = "esploro"
version = "0.1.0"
description = "A native macOS PostgreSQL client"
authors = []
edition = "2021"

[lib]
name = "esploro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
# keyring added in Phase 02 (connection management)
