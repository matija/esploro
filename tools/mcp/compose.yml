services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: acceptance
      POSTGRES_DB: acceptance
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=acceptance psql -h 127.0.0.1 -U postgres -d acceptance -c 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 90
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: acceptance
      MYSQL_DATABASE: acceptance
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -pacceptance acceptance -e 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 90
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: acceptance
      MARIADB_DATABASE: acceptance
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -uroot -pacceptance acceptance -e 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 90
