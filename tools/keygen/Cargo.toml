[package]
name = "keygen"
version = "0.1.0"
edition = "2021"
description = "Esploro license key generator (internal tool, not shipped)"
authors = ["Matija Munjaković"]
license = "MIT"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
